name: host-tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-unit-suite:
    name: Offline host unit suite
    # macOS is the project's host platform. A small number of host unit tests
    # compile an Objective-C harness with the Apple toolchain (xcrun/clang), so
    # the complete 70-test suite runs on macOS rather than Linux.
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run offline host unit suite (no device, no credentials)
        run: python3 run_all_tests.py
